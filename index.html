<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Management System</title>
<meta http-equiv="refresh" content="0; url=https://studentman.com/dashboard">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #f0f2f5;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.loader {
  text-align: center;
  padding: 40px;
}
.spinner {
  width: 48px; height: 48px;
  border: 4px solid #e0e0e0;
  border-top-color: #4f46e5;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 20px;
}
@keyframes spin { to { transform: rotate(360deg); } }
p { color: #64748b; font-size: 15px; }
a { color: #4f46e5; text-decoration: none; margin-top: 12px; display: inline-block; }
a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="loader">
  <div class="spinner"></div>
  <p>Redirecting to dashboard...</p>
  <a href="https://studentman.com/dashboard">Click here if not redirected</a>
</div>
<script>window.location.replace('https://studentman.com/dashboard');</script>
</body>
</html>
